[project]
name = "riskassessrl"
version = "1.0.0"
description = "Reinforcement learning platform for risk-adjusted stock-trading strategy simulation, with a live TradingView-style dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime dependencies are pinned in requirements.txt (this project is run, not
# packaged/published). Install with: pip install -r requirements.txt

[tool.ruff]
target-version = "py311"
line-length = 100
# Archived course project is kept verbatim for provenance; don't lint it.
extend-exclude = ["docs/archive"]
# Ruff's default lint selection (E4/E7/E9 + F) is intentionally kept — it is what
# CI enforces on src/ and backend/. Tighten here if you want stricter checks.
